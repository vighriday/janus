[project]
name = "janus-api"
version = "0.1.0"
description = "JANUS — decision guardrail for autonomous enterprise agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # azure
    "azure-identity>=1.19",
    "azure-search-documents>=11.6.0b12",
    "azure-ai-contentsafety>=1.0",
    "openai>=1.54",
    # orchestration
    "agent-framework>=1.0",
    # graph
    "neo4j>=5.26",
    "neo4j-graphrag>=1.3",
    # simulation
    "numpy>=2.1",
    "scipy>=1.14",
    "salib>=1.5.1",
    # eval
    "ragas>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]
