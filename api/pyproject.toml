[project]
name = "janus-api"
version = "0.1.0"
description = "JANUS — decision guardrail for autonomous enterprise agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # azure
    "azure-identity>=1.19",
    "azure-search-documents>=11.7.0b2",
    "azure-ai-contentsafety>=1.0",
    "azure-ai-evaluation>=1.17",
    "openai>=1.54",
    # orchestration — pinned: do not float once green (decorator validation is version-sensitive)
    "agent-framework==1.8.1",
    # graph (in-process — no server)
    "networkx>=3.4",
    # simulation
    "numpy>=2.1",
    "scipy>=1.14",
    "dowhy>=0.12",
    # observability — OpenTelemetry, dual sink: local Phoenix (demo) + Azure Monitor (prod)
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-openai>=0.1",
    "azure-monitor-opentelemetry-exporter>=1.0.0b30",
    # parsers
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["janus"]
